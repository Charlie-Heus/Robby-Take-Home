<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Follow-up engine{% endblock %}</title>
  <style>
    :root { --fg: #1d1d1f; --muted: #6e6e73; --line: #e3e3e6; --bg: #fff; --soft: #f6f6f8;
            --t1: #c0392b; --t2: #d35400; --t3: #2c6fbb; --t4: #7f8c8d; --warn: #fff4e5; --err: #fdecea; }
    * { box-sizing: border-box; }
    body { font: 14px/1.45 -apple-system, system-ui, sans-serif; color: var(--fg); background: var(--bg); margin: 0; }
    header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 20px;
             border-bottom: 1px solid var(--line); background: var(--soft); }
    header h1 { font-size: 16px; margin: 0 12px 0 0; }
    header h1 a { color: inherit; text-decoration: none; }
    header form { display: flex; gap: 6px; align-items: center; margin: 0; }
    main { padding: 16px 20px 40px; max-width: 1200px; }
    h2 { font-size: 15px; margin: 28px 0 8px; }
    h2 small { color: var(--muted); font-weight: normal; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 12px; color: var(--muted); font-weight: 600; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    tr.dim td { color: var(--muted); }
    .tier { display: inline-block; padding: 1px 7px; border-radius: 10px; color: #fff; font-size: 12px; white-space: nowrap; }
    .tier-1 { background: var(--t1); } .tier-2 { background: var(--t2); }
    .tier-3 { background: var(--t3); } .tier-4 { background: var(--t4); }
    .flash { padding: 6px 10px; margin: 4px 0; border-radius: 4px; background: var(--soft); }
    .flash.error { background: var(--err); }
    .diff { background: var(--warn); }
    .muted { color: var(--muted); }
    .pill { font-size: 11px; padding: 0 6px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); }
    details summary { cursor: pointer; color: var(--muted); }
    pre { background: var(--soft); padding: 8px; margin: 4px 0; font-size: 12px; overflow-x: auto; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; }
    dt { color: var(--muted); }
    dd { margin: 0; }
    button { font: inherit; padding: 3px 10px; cursor: pointer; }
    .wrap { overflow-x: auto; }
  </style>
</head>
<body>
<header>
  <h1><a href="{{ url_for('index', now=now_param) }}">Follow-up engine</a></h1>
  <form method="get" action="{{ request.path }}">
    <label>Now (UTC) <input type="datetime-local" name="now" value="{{ now_param }}"></label>
    <button>Go</button>
  </form>
  <form method="post" action="{{ url_for('ingest', now=now_param) }}"><button>Load seed data</button></form>
  <form method="post" action="{{ url_for('reset', now=now_param) }}"
        onsubmit="return confirm('Delete all quotes, events and outbox rows?')"><button>Reset DB</button></form>
</header>
<main>
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ category }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
